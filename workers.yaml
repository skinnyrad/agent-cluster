workers:
  - worker_id: worker-1
    url: http://localhost:8001
    model_id: gemma4
    enabled: true
    tags:
      - default

  - worker_id: worker-2
    url: http://localhost:8002
    model_id: gemma4
    enabled: true
    tags:
      - default

  # Disabled: on a 32 GB machine granite4.2 can't stay loaded alongside gemma4, so the
  # two models swap in and out of memory instead of running in parallel. Enable it when
  # it has its own Ollama host or enough memory.
  - worker_id: granite-1
    url: http://localhost:8006
    model_id: granite4.2
    enabled: false
    tags:
      - default

  - worker_id: code-analyzer-1
    url: http://localhost:8003
    model_id: gemma4
    enabled: false
    tags:
      - default

  - worker_id: code-analyzer-2
    url: http://localhost:8004
    model_id: gemma4
    enabled: false
    tags:
      - default

  - worker_id: worker-5
    url: http://localhost:8005
    model_id: gemma4
    enabled: false
    tags:
      - default