# Optional worker allowlist. Workers register themselves with the controller; when this
# file exists, only the enabled workers listed here may register. Tags listed here are
# added to the tags each worker reports. Delete the file to allow any worker that has the
# cluster token.
workers:
  - worker_id: worker-1
    tags:
      - default

  - worker_id: worker-2
    tags:
      - default

  # Disabled: on a 32 GB machine granite4.2 can't stay loaded alongside gemma4, so the
  # two models swap in and out of memory instead of running in parallel. Enable it when
  # it has its own Ollama host or enough memory.
  - worker_id: granite-1
    enabled: false
    tags:
      - default
